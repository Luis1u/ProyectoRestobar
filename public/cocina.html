<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba WebSocket</title>
</head>
<body>
  <h1>Prueba de WebSockets</h1>
  <h2>Lista de Productos</h2>
  
  <h3>Pedidos</h3>
  <div id="contenedor">

  </div>


  



  <!-- Socket.IO sirve automáticamente este script cliente -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Conectar al servidor
    const socket = io();
    const contenedor = document.getElementById('contenedor');

   

    let numeroPedido = 1;
   

    


    socket.on('pedidoNuevoCocina', (data)=>{
        const lista = document.createElement('ul');
    
       lista.append(`Pedido N° ${numeroPedido}`);
        numeroPedido ++;

        data.forEach(producto => {
            const li = document.createElement('li');
            li.append(producto.cantidad + " " +producto.nombre);
            lista.appendChild(li);
        });
             const btnMarcarPreparacion = document.createElement('button');

             btnMarcarPreparacion.addEventListener('click',()=>{
              if(btnMarcarPreparacion.textContent == "Marcar en preparacion"){
                btnMarcarPreparacion.textContent = "Marcar como listo"
              }else{
                if(btnMarcarPreparacion.textContent == "Marcar como listo"){
                  const mensaje = "Pedido listo"
                  socket.emit('pedidoParaMesa',mensaje);

                  btnMarcarPreparacion.textContent = "Listo";
                }

              }
             })
             btnMarcarPreparacion.textContent  = "Marcar en preparacion";
             lista.appendChild(btnMarcarPreparacion);
             
             contenedor.appendChild(lista);
    });






    
    


   
      
    
  </script>
</body>
</html>
