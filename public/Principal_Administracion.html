<body>

        <div class="contenedor-dos">
            <div class="menu">
                <ul>
                    <li><a href="#">Resumen</a></li>

                    <li class="con-submenu">

            <div class="contenedor_dinamico" id="contenedor_dinamico">

            </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        //#region Metodos Globales


        function ActualizarContenido(event, url) {
            if (event) event.preventDefault(); 

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al obtener la respuesta del servidor');
                    }
                    return response.text(); 
                })
                .then(html => {
                    const contenedor = document.getElementById('contenedor_dinamico');
                    contenedor.innerHTML = html;
                })
                .catch(error => {
                    console.error('Ocurrió un error:', error);
                    document.getElementById('contenedor_dinamico').innerHTML = `<p style="color: red; padding: 10px;">No se pudo cargar la información.</p>`;
                });
        }
        //#endregion


       
    //#region Eventos Repatartidor

    function filtrarTabla() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const filas = document.querySelectorAll('#tablaCuerpo tr');

        filas.forEach(fila => {
            const textoFila = fila.innerText.toLowerCase();
            if (textoFila.includes(input)) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    }

    // Función para ver la información completa de los repartidores (AHORA GLOBAL)
    function verRepartidor(url) {
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al obtener la respuesta del servidor');
                }
                return response.text(); 
            })
            .then(html => {
                const contenedor = document.getElementById('contenedor_dinamico');
                contenedor.innerHTML = html;
            })
            .catch(error => {
                console.error('Ocurrió un error:', error);
                document.getElementById('contenedor_dinamico').innerHTML = `<p style="color: red; padding: 10px;">No se pudo cargar la información.</p>`;
            });
    }

    function EnviarFormulario(event, idFormulario, url) {
    if (event) event.preventDefault();

    const nombre  = document.getElementById('nombre');
    const texto = nombre.value;
    const caja = document.getElementById('cjaErrorNombre');


    if([...texto].some(c => c !== ' ' && !isNaN(c))){
        caja.textContent = 'Solo de ve contener letras'
        return;
    }




    const formulario = document.getElementById(idFormulario);
    const formData = new FormData(formulario);
    const data = Object.fromEntries(formData.entries());

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Error en la respuesta del servidor');
        }
        return response.text(); // Lee el HTML enviado por res.send(html)
    })
    .then(html => {
        // Reemplaza el contenido del contenedor con el EJS renderizado
        document.getElementById('contenedor_dinamico').innerHTML = html;
    })
    .catch(error => {
        console.error('Ocurrió un error:', error);
        document.getElementById('contenedor_dinamico').innerHTML = 
            `<p style="color: red; padding: 10px;">No se pudo procesar la solicitud.</p>`;
    });
}
    //#endregion 
    </script>
</body>
