<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Mesa</title>
  </head>
  <body>
    <div class="contenedor-formulario">
      <h2>Agregar Mesa</h2>

      <form
        id="formulariomesa"
        onsubmit="
          EnviarFormularioMesa(
            event,
            'agregar',
            'formulariomesa',
            '/mesa/nuevo/mesa',
          )
        "
      >
        <!-- Número de mesa -->
        <div class="grupo-campo">
          <label for="numeroMesa">Número</label>
          <input
            type="number"
            id="numeroMesa"
            name="camlnummes"
            required
            oninput="convertirMayusculas(this)"
            style="text-transform: uppercase"
          />
          <p id="cjaErrorCamlnummes" class="cjaError"></p>
        </div>

        <!-- Capacidad de la mesa -->
        <div class="grupo-campo">
          <label for="capacidadMesa">Capacidad</label>
          <input
            type="number"
            id="capacidadMesa"
            name="camlcapmes"
            min="1"
          />
          <p id="cjaErrorCamlcapmes" class="cjaError"></p>
        </div>

        <!-- Descripción -->
        <div class="grupo-campo">
          <label for="descripcionMesa">Descripción</label>
          <input
            type="text"
            id="descripcionMesa"
            name="camldesmes"
            oninput="convertirMayusculas(this)"
            style="text-transform: uppercase"
          />
          <p id="cjaErrorCamldesmes" class="cjaError"></p>
        </div>

        <!-- Estado del sistema (Activo/Inactivo) -->
        <div class="grupo-campo">
          <label for="activoMesa">Habilitado</label>
          <select name="camlactmes" id="activoMesa">
            <option value="true">ACTIVO</option>
            <option value="false">INACTIVO</option>
          </select>
          <p id="cjaErrorCamlactmes" class="cjaError"></p>
        </div>

        <!-- Estado operativo de la mesa -->
        <div class="grupo-campo">
          <label for="estadoMesa">Estado Operativo</label>
          <select name="camlestmes" id="estadoMesa">
            <option value="LIBRE">LIBRE</option>
            <option value="ESPERA">EN ESPERA</option>
            <option value="OCUPADO">OCUPADO</option>
          </select>
          <p id="cjaErrorCamlestmes" class="cjaError"></p>
        </div>

        <!-- Botones de Acción -->
        <div class="acciones-formulario">
          <button type="submit" class="boton boton-primario">Guardar</button>
          <button
            type="button"
            class="boton boton-secundario"
            onclick="ActualizarContenido('/mesa/lista')"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
